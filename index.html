<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: Seasonal ids</title>
        <style>
            #cud{
                background-color: greenyellow
            }
            #winter {
                background-color: blue
            }
            
          #summer {
            background-color: yellow
          }  
          #Snowman {
            background-color: pink
          }
          h1{
            color:blueviolet
          }
        </style>
    </head>
    <body>
        
        
        <h1 id="heading">Olaf's favorite seasons</h1>
        
        <h2 id="summer">Summer</h2>
        <p id="Snowman">He's a happy snowman, doing what frozen things do in summer.</p>
        
        <h2 id="winter">Winter</h2>
        <p id="cud">He likes to stay in and cuddle</p>
    </body>
</html>
